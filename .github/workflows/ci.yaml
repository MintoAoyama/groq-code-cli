name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # npm 10 bundled with Node 22 fails with EMISSINGSIGNATUREKEY on newer attestations
      - if: matrix.node-version == 26
        run: npm audit signatures
      - run: npm run build
      - run: npm test
      # Importing the entry point loads ink, commander, chalk and groq-sdk, which unit tests do not cover
      - run: node dist/core/cli.js --version
      - run: node dist/core/cli.js --help
